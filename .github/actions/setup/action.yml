name: Setup
description: Node 24 and node_modules, restored from cache when the lockfile is unchanged.

runs:
  using: composite
  steps:
    # npm's download cache stays as the fallback for a node_modules miss
    # (any lockfile change), so a miss is no slower than before.
    - name: ⚙️ Setup Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: "npm"

    # Caching node_modules itself skips `npm ci` entirely on a hit, about 45 s
    # per job. The key carries the exact Node version and the runner's
    # architecture so modules built for another Node are never restored.
    - name: 💾 Cache node_modules
      id: modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-modules-${{ hashFiles('package-lock.json') }}

    - name: 📦 Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
