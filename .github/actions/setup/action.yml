name: Setup
description: Node 24 and node_modules, restored from cache when the lockfile is unchanged.

runs:
  using: composite
  steps:
    - name: ⚙️ Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    # Caching node_modules itself (not just npm's download cache) skips
    # `npm ci` entirely on a hit, which saves about 45 s per job.
    - name: 💾 Cache node_modules
      id: modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: ${{ runner.os }}-node24-modules-${{ hashFiles('package-lock.json') }}

    - name: 📦 Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
