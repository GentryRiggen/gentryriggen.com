name: CI/CD

# Kept small on purpose: this is a hobby site, and a broken deploy is fixed
# forward. A pull request gets lint, types, the fast unit tests, a build and
# one smoke test that loads every page. main only builds and deploys.
# The deeper Playwright specs, the perf budget and the sims run locally
# (or by hand: Actions > Sims > Run workflow).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, but never a deploy in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ✅ Lint + types
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: 🔍 Lint
        run: npm run lint
      - name: 🔷 Type check
        run: npm run type-check

  unit:
    name: 🧪 Unit tests ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: 🧪 Unit tests
        env:
          JEST_LANE: fast
        run: npx jest --shard=${{ matrix.shard }}

  # Every page loads in Chromium without throwing (e2e/smoke.spec.ts).
  smoke:
    name: 🎭 Smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: 🌐 Install Chromium
        run: npx playwright install --with-deps chromium
      - name: 🏗️ Build for e2e
        env:
          NEXT_PUBLIC_E2E: "1"
        run: npm run build
      - name: 🎬 Smoke test
        env:
          E2E_PREBUILT: "1"
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # Restored everywhere, saved only from main, so pull requests never fill
      # the Actions cache with per-commit entries.
      - name: 💾 Restore Next.js build cache
        uses: actions/cache/restore@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-

      - name: 🔑 Jim's sign-in tenant is set
        if: github.event_name == 'push'
        env:
          JIM_TENANT: ${{ vars.JIM_TENANT }}
        run: |
          if [ -z "$JIM_TENANT" ]; then
            echo "::error::The JIM_TENANT repository variable is empty: set it (Settings > Secrets and variables > Actions > Variables) to Jim's sign-in tenant id, or the deployed Jim can't sign in."
            exit 1
          fi

      - name: 🏗️ Build
        env:
          NEXT_PUBLIC_JIM_TENANT: ${{ vars.JIM_TENANT }}
        run: npm run build

      - name: 🔒 Check Jim's site
        run: node scripts/jim-site.mjs --check

      - name: 💾 Save Next.js build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

      - name: 📤 Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: out
          retention-days: 1

  deploy:
    name: 🚀 Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: out

      - name: 🔥 Validate Firebase config
        run: |
          if grep -q "your-firebase-project-id\|placeholder\|example" .firebaserc; then
            echo "::error::.firebaserc contains placeholder values. Set a valid Firebase project ID."
            exit 1
          fi

      - name: 🚀 Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: "${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: 🔐 Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@15 deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID"
          rm -f "$RUNNER_TEMP/sa.json"

      # Its own step, so a missing IAM role here never blocks the rules deploy.
      # Needs the service account to hold Cloud Datastore Index Admin.
      - name: 🗂️ Deploy Firestore indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@15 deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID"
          rm -f "$RUNNER_TEMP/sa.json"
