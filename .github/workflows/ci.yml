name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled; a second push to main must never
  # cancel a deploy midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Does this change touch anything the browser tests cover? ──
  # Docs-only commits and dev-dependency bumps skip the (slow) e2e jobs, and
  # so does anything marked [skip e2e] in a commit message or the PR title.
  #
  # On a push to main it also checks whether this exact code (the same git
  # tree, which a squash merge keeps) already passed a pull request run. If so
  # the checks and e2e are skipped, and main only builds and deploys.
  changes:
    name: 🔎 Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A matching tree means the same files ran through the same workflow
      # (ci.yml is part of the tree), so a pass there is a pass here.
      - name: ♻️ Already verified in a pull request?
        id: verified
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          shas=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=30" \
            --jq ".workflow_runs[] | select(.head_repository.full_name == \"$REPO\") | .head_sha" || true)
          for sha in $shas; do
            pr_tree=$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha 2>/dev/null || true)
            if [ "$pr_tree" = "$tree" ]; then
              echo "Tree $tree already passed in the pull request run for $sha."
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing pull request run for tree $tree: running everything."
          echo "verified=false" >> "$GITHUB_OUTPUT"

      - name: 🔎 Decide whether e2e is needed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERIFIED: ${{ steps.verified.outputs.verified }}
        run: |
          if [ "$VERIFIED" = "true" ]; then
            echo "Already verified in a pull request: skipping browser tests."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          has_base=false
          if git cat-file -e "$base^{commit}" 2>/dev/null; then has_base=true; fi
          # Opt-out marker: [skip e2e] in the PR title or any commit message.
          # (A squash merge carries the PR title into main's commit message.)
          if [ "$has_base" = true ]; then
            messages=$(git log --format=%B "$base..HEAD")
          else
            messages=$(git log -1 --format=%B HEAD)
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$messages" | grep -qiF '[skip e2e]'; then
            echo "Found [skip e2e]: skipping browser tests."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new branch or a force push has no usable base: run everything.
          if [ "$has_base" != true ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if echo "$changed" | grep -Eq '^(app|components|lib|public|e2e|scripts|\.github/actions)/|^(package(-lock)?\.json|next\.config\.ts|playwright\.config\.ts|tsconfig\.json|postcss\.config\.[a-z]+|\.github/workflows/ci\.yml)$'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

      # The e2e matrix lists spec files by hand; a spec missing from every
      # list would never run in CI, so that fails here instead.
      - name: 🧾 Every e2e spec has a CI group
        run: |
          missing=0
          for spec in e2e/*.spec.ts; do
            if ! grep -qF "$spec" .github/workflows/ci.yml; then
              echo "::error file=$spec::$spec is in no e2e group in .github/workflows/ci.yml"
              missing=1
            fi
          done
          exit $missing

  # ── Static checks, unit tests and rules tests, in parallel ──
  # Code a pull request already verified skips all three on main.
  checks:
    name: ✅ Lint, format, types
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: 🔍 Lint
        run: npm run lint

      - name: 💅 Format check
        run: npm run format:check

      - name: 🔷 Type check
        run: npm run type-check

  # One file (the plane balance sweep, about 130 s) outweighs whole shards,
  # and Jest can't split a file, so it gets its own job and the shards skip it.
  unit:
    name: 🧪 Unit tests ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 1/3
            args: --shard=1/3
            ignore: /plane-builder/balance/__tests__/balance.test.ts$
          - name: 2/3
            args: --shard=2/3
            ignore: /plane-builder/balance/__tests__/balance.test.ts$
          - name: 3/3
            args: --shard=3/3
            ignore: /plane-builder/balance/__tests__/balance.test.ts$
          - name: plane balance
            args: lib/plane-builder/balance/__tests__/balance.test.ts
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: 🧪 Unit tests
        env:
          JEST_EXTRA_IGNORE: ${{ matrix.ignore }}
        run: npx jest ${{ matrix.args }}

  rules:
    name: 🔐 Firestore rules tests
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: ☕ Setup Java (Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 💾 Cache Firestore emulator
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: 🔐 Firestore rules tests
        run: npm run test:rules

  # ── Builds ──
  # The production build always runs: deploy ships it, and a pull request has
  # to prove it builds before main may skip its checks. The e2e build
  # (NEXT_PUBLIC_E2E=1) runs once and every e2e shard serves it.
  # Next's cache is restored everywhere but saved only from main, so pull
  # requests never fill the Actions cache with per-commit entries.
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup

      - name: 💾 Restore Next.js build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-

      # Jim signs in through its own tenant, whose id is built into the page
      # (public, like the rest of the Firebase web config). A build that ships
      # must have it, or Jim could not sign in; pull requests may build without.
      - name: 🔑 Jim's sign-in tenant is set
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JIM_TENANT: ${{ vars.JIM_TENANT }}
        run: |
          if [ -z "$JIM_TENANT" ]; then
            echo "::error::The JIM_TENANT repository variable is empty: set it (Settings > Secrets and variables > Actions > Variables) to Jim's sign-in tenant id, or the deployed Jim can't sign in."
            exit 1
          fi

      - name: 🏗️ Build
        env:
          NEXT_PUBLIC_JIM_TENANT: ${{ vars.JIM_TENANT }}
        run: npm run build

      # Jim's own site: the page's inline scripts get hashed into its CSP, and
      # a page that loads test hooks, App Check, reCAPTCHA or analytics fails.
      - name: 🔒 Check Jim's site
        run: node scripts/jim-site.mjs --check

      - name: 💾 Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

      - name: 📤 Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: out
          retention-days: 1

  e2e-build:
    name: 🏗️ Build for e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: 💾 Restore Next.js build cache
        uses: actions/cache/restore@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('package-lock.json') }}-

      - name: 🏗️ Build
        env:
          NEXT_PUBLIC_E2E: "1"
        run: npm run build

      - name: 💾 Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

      - name: 📤 Upload e2e build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: out
          retention-days: 1

  # ── Browser tests (each shard serves the one e2e build) ──
  e2e:
    name: 🎭 E2E ${{ matrix.name }}
    needs: [changes, e2e-build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Software WebGL (SwiftShader) takes every core it can get, so those specs
    # get their own jobs with one worker; running them beside the plain specs
    # starves those and makes them time out. The slow groups are split with
    # Playwright's --shard so no single job runs much past five minutes.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium runs every test; WebKit, the iPad and the iPhone run the
          # @smoke ones (see playwright.config.ts). Firefox is left out.
          - name: Site + Jim + Ever Onward + builder UI
            files: e2e/home.spec.ts e2e/ship-builder.spec.ts e2e/admin.spec.ts e2e/app-check.spec.ts e2e/jim.spec.ts e2e/ever-onward.spec.ts
            args: --project=chromium --project=webkit --project=ipad --project=iphone --grep-invert "renders the 3D scene"
            workers: 2
            browsers: chromium webkit
            no-webgl: 1
          # Software WebGL (SwiftShader) takes every core it can get, so the
          # 3D specs get one-worker jobs. --grep keeps ship-builder.spec.ts to
          # its 3D test ("ship-builder-" matches the other specs' file names).
          - name: WebGL ship builder (1/2)
            files: e2e/ship-builder.spec.ts e2e/ship-builder-trial.spec.ts e2e/ship-builder-walk.spec.ts e2e/ship-builder-drive.spec.ts
            args: --project=chromium --grep "ship-builder-|renders the 3D scene" --shard=1/2
            workers: 1
            browsers: chromium
          - name: WebGL ship builder (2/2)
            files: e2e/ship-builder.spec.ts e2e/ship-builder-trial.spec.ts e2e/ship-builder-walk.spec.ts e2e/ship-builder-drive.spec.ts
            args: --project=chromium --grep "ship-builder-|renders the 3D scene" --shard=2/2
            workers: 1
            browsers: chromium
          # WebKit and the iPad run Plane Builder's @smoke tests.
          - name: WebGL plane builder
            files: e2e/plane-builder.spec.ts e2e/plane-builder-offline.spec.ts
            args: --project=chromium --project=webkit --project=ipad
            workers: 1
            browsers: chromium webkit
          # Draw calls and triangles per fixed scene against e2e/perf-budget.json
          # (frame times are only reported). PERF_UPDATE=1 rewrites the budget.
          - name: WebGL perf budget (1/2)
            files: e2e/perf.spec.ts
            args: --project=chromium --shard=1/2
            workers: 1
            browsers: chromium
            perf: perf-results-1-of-2
          - name: WebGL perf budget (2/2)
            files: e2e/perf.spec.ts
            args: --project=chromium --shard=2/2
            workers: 1
            browsers: chromium
            perf: perf-results-2-of-2
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browsers || 'all' }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browsers || 'all' }}-

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: 📥 Download e2e build
        uses: actions/download-artifact@v8
        with:
          name: e2e-build
          path: out

      # E2E_PREBUILT makes Playwright's web server serve out/ as is.
      - name: 🎬 Run E2E tests
        env:
          E2E_NO_WEBGL: ${{ matrix.no-webgl }}
          E2E_PREBUILT: "1"
        run: npx playwright test ${{ matrix.files }} ${{ matrix.args }} --workers=${{ matrix.workers }}

      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 7

      # Only the perf jobs write this file; each shard uploads its own half.
      - name: 📤 Upload perf results
        if: always() && matrix.perf && hashFiles('perf-results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.perf }}
          path: perf-results.json
          retention-days: 30

  # ── Deploy (main branch only) ──
  # checks, unit, rules and e2e are skipped (not failed) when a pull request
  # already verified this tree, and e2e also when nothing it covers changed.
  #
  # Keyless: GitHub's OIDC token is exchanged through Workload Identity
  # Federation for a short-lived token of the deployer service account, so no
  # service account key exists anywhere. The pool only trusts this repository's
  # main branch. Every action here is pinned to a commit (the tag is in the
  # comment), because this is the one job that can reach production.
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [changes, checks, unit, rules, build, e2e-build, e2e]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success' && needs.build.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.checks.result)
      && contains(fromJSON('["success","skipped"]'), needs.unit.result)
      && contains(fromJSON('["success","skipped"]'), needs.rules.result)
      && contains(fromJSON('["success","skipped"]'), needs.e2e-build.result)
      && contains(fromJSON('["success","skipped"]'), needs.e2e.result) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      # Deploy tools come from the lockfile (exact, integrity-checked), with no
      # install scripts, before this job ever holds a Google credential.
      - name: 📦 Install deploy tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: out

      # Builds out-jim/ (Jim's own site) from out/ and fills the hashes into
      # firebase.json's CSP; fails rather than ship a page the CSP would break.
      - name: 🔒 Build Jim's site
        run: node scripts/jim-site.mjs

      - name: 🔥 Validate Firebase config
        run: |
          if grep -q "your-firebase-project-id\|placeholder\|example" .firebaserc; then
            echo "::error::.firebaserc contains placeholder values. Set a valid Firebase project ID."
            exit 1
          fi

      - name: 🔑 Deploy identity is set
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          missing=0
          if ! printf '%s' "$GCP_WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$'; then
            echo "::error::The GCP_WIF_PROVIDER repository variable is missing or malformed: set it (Settings > Secrets and variables > Actions > Variables) to the full Workload Identity provider name, projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>."
            missing=1
          fi
          if ! printf '%s' "$GCP_DEPLOYER_SA" | grep -Eq '^[a-z][a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$'; then
            echo "::error::The GCP_DEPLOYER_SA repository variable is missing or malformed: set it to the deployer service account's email."
            missing=1
          fi
          exit $missing

      # Writes a short-lived credential config (no key) and points
      # GOOGLE_APPLICATION_CREDENTIALS at it for firebase-tools.
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: 🚀 Deploy both sites and Firestore rules
        run: npx --no-install firebase-tools deploy --only hosting:main,hosting:jim,firestore:rules --project gentryriggen --non-interactive

      # Its own step, so a missing IAM role here never blocks the sites or rules.
      # Needs the deployer to hold Cloud Datastore Index Admin.
      - name: 🗂️ Deploy Firestore indexes
        run: npx --no-install firebase-tools deploy --only firestore:indexes --project gentryriggen --non-interactive
