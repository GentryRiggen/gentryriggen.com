name: CI/CD

# Kept small on purpose: this is a hobby site, and a broken deploy is fixed
# forward. A pull request gets lint, types, the fast unit tests, a build and
# one smoke test that loads every page. main only builds and deploys.
# The deeper Playwright specs, the perf budget and the sims run locally
# (or by hand: Actions > Sims > Run workflow).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, but never a deploy in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ✅ Lint + types
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: 🔍 Lint
        run: npm run lint
      - name: 🔷 Type check
        run: npm run type-check

  unit:
    name: 🧪 Unit tests ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: 🧪 Unit tests
        env:
          JEST_LANE: fast
        run: npx jest --shard=${{ matrix.shard }}

  # Every page loads in Chromium without throwing (e2e/smoke.spec.ts).
  smoke:
    name: 🎭 Smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: 🌐 Install Chromium
        run: npx playwright install --with-deps chromium
      - name: 🏗️ Build for e2e
        env:
          NEXT_PUBLIC_E2E: "1"
        # One retry: the build fetches Google Fonts, which now and then times out.
        run: npm run build || npm run build
      - name: 🎬 Smoke test
        env:
          E2E_PREBUILT: "1"
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Next's cache is restored everywhere but saved only from main, so pull
  # requests never fill the Actions cache with per-commit entries.
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: 💾 Restore Next.js build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-

      # Jim signs in through its own tenant, whose id is built into the page
      # (public, like the rest of the Firebase web config). A build that ships
      # must have it, or Jim could not sign in; pull requests may build without.
      - name: 🔑 Jim's sign-in tenant is set
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JIM_TENANT: ${{ vars.JIM_TENANT }}
        run: |
          if [ -z "$JIM_TENANT" ]; then
            echo "::error::The JIM_TENANT repository variable is empty: set it (Settings > Secrets and variables > Actions > Variables) to Jim's sign-in tenant id, or the deployed Jim can't sign in."
            exit 1
          fi

      - name: 🏗️ Build
        env:
          NEXT_PUBLIC_JIM_TENANT: ${{ vars.JIM_TENANT }}
        # One retry: the build fetches Google Fonts, which now and then times out.
        run: npm run build || npm run build

      # Jim's own site: the page's inline scripts get hashed into its CSP, and
      # a page that loads test hooks, App Check, reCAPTCHA or analytics fails.
      - name: 🔒 Check Jim's site
        run: node scripts/jim-site.mjs --check

      - name: 💾 Save Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-production-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

      - name: 📤 Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: out
          retention-days: 1

  # main branch. Every action here is pinned to a commit (the tag is in the
  # comment), because this is the one job that can reach production.
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      # Deploy tools come from the lockfile (exact, integrity-checked), with no
      # install scripts, before this job ever holds a Google credential.
      - name: 📦 Install deploy tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: out

      # Builds out-jim/ (Jim's own site) from out/ and fills the hashes into
      # firebase.json's CSP; fails rather than ship a page the CSP would break.
      - name: 🔒 Build Jim's site
        run: node scripts/jim-site.mjs

      - name: 🔥 Validate Firebase config
        run: |
          if grep -q "your-firebase-project-id\|placeholder\|example" .firebaserc; then
            echo "::error::.firebaserc contains placeholder values. Set a valid Firebase project ID."
            exit 1
          fi

      - name: 🔑 Deploy identity is set
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          missing=0
          if ! printf '%s' "$GCP_WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$'; then
            echo "::error::The GCP_WIF_PROVIDER repository variable is missing or malformed: set it (Settings > Secrets and variables > Actions > Variables) to the full Workload Identity provider name, projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>."
            missing=1
          fi
          if ! printf '%s' "$GCP_DEPLOYER_SA" | grep -Eq '^[a-z][a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$'; then
            echo "::error::The GCP_DEPLOYER_SA repository variable is missing or malformed: set it to the deployer service account's email."
            missing=1
          fi
          exit $missing

      # Writes a short-lived credential config (no key) and points
      # GOOGLE_APPLICATION_CREDENTIALS at it for firebase-tools.
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: 🚀 Deploy both sites and Firestore rules
        run: npx --no-install firebase-tools deploy --only hosting:main,hosting:jim,firestore:rules --project gentryriggen --non-interactive

      # Its own step, so a missing IAM role here never blocks the sites or rules.
      # Needs the deployer to hold Cloud Datastore Index Admin.
      - name: 🗂️ Deploy Firestore indexes
        run: npx --no-install firebase-tools deploy --only firestore:indexes --project gentryriggen --non-interactive
