name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static checks + unit tests ──
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 💅 Format check
        run: npm run format:check

      - name: 🔷 Type check
        run: npm run type-check

      - name: 🧪 Unit tests
        run: npm test

  # ── Browser tests (runs in parallel with validate) ──
  e2e:
    name: 🎭 E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Software WebGL (SwiftShader) takes every core it can get, so those specs
    # get their own jobs with one worker; running them beside the plain specs
    # starves those and makes them time out.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Builder + home (all browsers)
            files: e2e/home.spec.ts e2e/ship-builder.spec.ts
            args: --grep-invert "holding a placed block|paints a tapped block|renders the 3D scene"
            workers: 2
            browsers: ""
            no-webgl: 1
          - name: WebGL builder scene
            files: e2e/ship-builder.spec.ts
            args: --project=chromium --grep "holding a placed block|paints a tapped block|renders the 3D scene"
            workers: 1
            browsers: chromium
          - name: WebGL iceberg + time
            files: e2e/ship-builder-iceberg.spec.ts e2e/ship-builder-time.spec.ts
            args: --project=chromium
            workers: 1
            browsers: chromium
          - name: WebGL sea trial
            files: e2e/ship-builder-trial.spec.ts
            args: --project=chromium
            workers: 1
            browsers: chromium
          - name: WebGL visual
            files: e2e/ship-builder-visual.spec.ts
            args: --project=chromium
            workers: 1
            browsers: chromium
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browsers || 'all' }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browsers || 'all' }}-

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: 🎬 Run E2E tests
        env:
          E2E_NO_WEBGL: ${{ matrix.no-webgl }}
        run: npx playwright test ${{ matrix.files }} ${{ matrix.args }} --workers=${{ matrix.workers }}

      # Visual diffs (expected, actual, diff images) live in the report.
      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ── Production build (waits for validate + e2e) ──
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: out
          retention-days: 1

  # ── Deploy (main branch only) ──
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: out

      - name: 🔥 Validate Firebase config
        run: |
          if grep -q "your-firebase-project-id\|placeholder\|example" .firebaserc; then
            echo "::error::.firebaserc contains placeholder values. Set a valid Firebase project ID."
            exit 1
          fi

      - name: 🚀 Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: "${{ secrets.FIREBASE_PROJECT_ID }}"
