name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Does this change touch anything the browser tests cover? ──
  # Docs-only commits and dev-dependency bumps skip the (slow) e2e jobs.
  changes:
    name: 🔎 Changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Decide whether e2e is needed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          # A new branch or a force push has no usable base: run everything.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if echo "$changed" | grep -Eq '^(app|components|lib|public|e2e|scripts)/|^(package(-lock)?\.json|next\.config\.ts|playwright\.config\.ts|tsconfig\.json|postcss\.config\.[a-z]+|\.github/workflows/ci\.yml)$'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Static checks + unit tests ──
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 💅 Format check
        run: npm run format:check

      - name: 🔷 Type check
        run: npm run type-check

      - name: 🧪 Unit tests
        run: npm test

      # Built here, beside the e2e jobs, so deploying does not wait on (or pay
      # for) a separate build job.
      - name: 🏗️ Build
        run: npm run build

      - name: 📤 Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: out
          retention-days: 1

  # ── Browser tests (runs in parallel with validate) ──
  e2e:
    name: 🎭 E2E ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Software WebGL (SwiftShader) takes every core it can get, so those specs
    # get their own jobs with one worker; running them beside the plain specs
    # starves those and makes them time out.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium runs every test; WebKit and the iPad run the @smoke ones
          # (see playwright.config.ts). Firefox is left out.
          - name: Builder + home (Chromium, WebKit, iPad)
            files: e2e/home.spec.ts e2e/ship-builder.spec.ts
            args: --project=chromium --project=webkit --project=ipad --grep-invert "holding a placed block|paints a tapped block|renders the 3D scene"
            workers: 2
            browsers: chromium webkit
            no-webgl: 1
          # The three pointer-sensitive builder tests join the other one-worker
          # WebGL specs; --grep keeps ship-builder.spec.ts to just those three
          # (it matches the file name, and "ship-builder-" is the other specs).
          - name: WebGL builder + iceberg + time + breakup
            files: e2e/ship-builder.spec.ts e2e/ship-builder-iceberg.spec.ts e2e/ship-builder-time.spec.ts e2e/ship-builder-breakup.spec.ts
            args: --project=chromium --grep "ship-builder-|holding a placed block|paints a tapped block|renders the 3D scene"
            workers: 1
            browsers: chromium
          - name: WebGL sea trial
            files: e2e/ship-builder-trial.spec.ts
            args: --project=chromium
            workers: 1
            browsers: chromium
          - name: WebGL visual
            files: e2e/ship-builder-visual.spec.ts
            args: --project=chromium
            workers: 1
            browsers: chromium
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browsers || 'all' }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browsers || 'all' }}-

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: 🎬 Run E2E tests
        env:
          E2E_NO_WEBGL: ${{ matrix.no-webgl }}
        run: npx playwright test ${{ matrix.files }} ${{ matrix.args }} --workers=${{ matrix.workers }}

      # Visual diffs (expected, actual, diff images) live in the report.
      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ── Deploy (main branch only) ──
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    # e2e is skipped (not failed) when nothing it covers changed.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: out

      - name: 🔥 Validate Firebase config
        run: |
          if grep -q "your-firebase-project-id\|placeholder\|example" .firebaserc; then
            echo "::error::.firebaserc contains placeholder values. Set a valid Firebase project ID."
            exit 1
          fi

      - name: 🚀 Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: "${{ secrets.FIREBASE_PROJECT_ID }}"
