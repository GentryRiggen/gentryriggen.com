name: Sims

# The game-balance simulations (jest.sims.js): bots play whole runs to check
# pacing and scorecards. They take minutes, so they run only by hand
# (Actions > Sims > Run workflow) or locally with `npm run test:sims`.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sims:
    name: 🎲 Sims ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/6, 2/6, 3/6, 4/6, 5/6, 6/6]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: 🎲 Simulations
        env:
          JEST_LANE: sims
        run: npx jest --shard=${{ matrix.shard }}
